name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: 'Terraform Process'
    runs-on: ubuntu-latest
    
    # هذا السطر السحري يجبر كل الخطوات على العمل داخل مجلد مشروعك الصحيح
    defaults:
      run:
        working-directory: ./Desktop/CloudScale-Project2

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan
